services:
  db:
    image: postgres:16
    container_name: docsuite-postgres
    environment:
      POSTGRES_DB: docsuite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - docsuite_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: docsuite-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/docsuite
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  docsuite_pgdata:
